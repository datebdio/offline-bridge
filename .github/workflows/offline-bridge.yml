name: Offline Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - requests/request.json
      - scripts/**
      - schemas/**
      - skills/**
      - .github/workflows/offline-bridge.yml
  push:
    branches: [main]
    paths:
      - requests/request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build offline bundle
        env:
          BRIDGE_GITHUB_TOKEN: ${{ secrets.BRIDGE_GITHUB_TOKEN }}
        run: |
          python scripts/build_bundle.py \
            --request requests/request.json \
            --output bridge-output

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: bridge-manifest
          path: bridge-output/manifest/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Upload part 001
        if: ${{ hashFiles('bridge-output/parts/bundle.part-001') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-001
          path: bridge-output/parts/bundle.part-001
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 002
        if: ${{ hashFiles('bridge-output/parts/bundle.part-002') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-002
          path: bridge-output/parts/bundle.part-002
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 003
        if: ${{ hashFiles('bridge-output/parts/bundle.part-003') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-003
          path: bridge-output/parts/bundle.part-003
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 004
        if: ${{ hashFiles('bridge-output/parts/bundle.part-004') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-004
          path: bridge-output/parts/bundle.part-004
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 005
        if: ${{ hashFiles('bridge-output/parts/bundle.part-005') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-005
          path: bridge-output/parts/bundle.part-005
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 006
        if: ${{ hashFiles('bridge-output/parts/bundle.part-006') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-006
          path: bridge-output/parts/bundle.part-006
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 007
        if: ${{ hashFiles('bridge-output/parts/bundle.part-007') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-007
          path: bridge-output/parts/bundle.part-007
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 008
        if: ${{ hashFiles('bridge-output/parts/bundle.part-008') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bridge-part-008
          path: bridge-output/parts/bundle.part-008
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-msp11-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: bridge-manifest
          path: manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-part-*
          merge-multiple: true
          path: parts
      - name: Verify and extract offline installers
        shell: pwsh
        run: |
          $manifest = Get-Content 'manifest/bridge-manifest.json' -Raw | ConvertFrom-Json
          $part = 'parts/bundle.part-001'
          if ((Get-FileHash $part -Algorithm SHA256).Hash.ToLower() -ne $manifest.payload.archive_sha256) { throw 'bundle sha mismatch' }
          New-Item -ItemType Directory -Path payload -Force | Out-Null
          tar -xf $part -C payload
          foreach ($source in $manifest.build.sources) {
            $path = Join-Path (Get-Location) ('payload/' + $source.destination)
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $source.sha256) { throw "file sha mismatch $path" }
            $sig = Get-AuthenticodeSignature $path
            Write-Host "Installer=$($source.destination) Signature=$($sig.Status) Signer=$($sig.SignerCertificate.Subject)"
          }
      - name: Install Microsoft Speech Platform 11 x86 Runtime
        shell: pwsh
        run: |
          $path = (Resolve-Path 'payload/downloads/SpeechPlatformRuntime_x86.msi').Path
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$path`" /qn /norestart /l*v `"$env:TEMP\\msp11runtime.log`""
          Write-Host "Runtime msiexec exit code=$($p.ExitCode)"
          if ($p.ExitCode -notin @(0,3010)) { Get-Content "$env:TEMP\\msp11runtime.log" -Tail 90; throw 'Runtime install failed' }
      - name: Install Microsoft Speech Platform 11 HuiHui
        shell: pwsh
        run: |
          $path = (Resolve-Path 'payload/downloads/MSSpeech_TTS_zh-CN_HuiHui.msi').Path
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$path`" /qn /norestart /l*v `"$env:TEMP\\msp11voice.log`""
          Write-Host "HuiHui msiexec exit code=$($p.ExitCode)"
          if ($p.ExitCode -notin @(0,3010)) { Get-Content "$env:TEMP\\msp11voice.log" -Tail 90; throw 'Voice install failed' }
      - name: Run real x86 speech detection and WAV test
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference='Stop'
          $asm = [Reflection.Assembly]::Load('Microsoft.Speech, Version=11.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35')
          Write-Output "ASSEMBLY=$($asm.FullName)"
          $s = New-Object Microsoft.Speech.Synthesis.SpeechSynthesizer
          $voices = @($s.GetInstalledVoices())
          foreach($v in $voices){Write-Output "VOICE=$($v.VoiceInfo.Name) LANG=$($v.VoiceInfo.Culture.Name) ENABLED=$($v.Enabled)"}
          $zh = @($voices | Where-Object {$_.Enabled -and $_.VoiceInfo.Culture.Name -eq 'zh-CN'})
          if($zh.Count -eq 0){throw 'No zh-CN voice in 32-bit Microsoft.Speech'}
          $s.SelectVoice($zh[0].VoiceInfo.Name)
          $s.Rate=0
          $s.Volume=100
          $s.SetOutputToWaveFile('demo.wav')
          $text=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('5oGt5Zac5Lit5aWW77yB6I635b6X5LiA562J5aWW77yM6K+35Yiw5YmN5Y+w6aKG5Y+W77yB'))
          $s.Speak($text)
          $s.SetOutputToNull()
          $s.Dispose()
          $wav=Get-Item demo.wav
          Write-Output "WAV=$($wav.Length)"
          if($wav.Length -lt 1000){throw 'Generated WAV invalid'}
          '@
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'test-msp11.ps1'), $script, [Text.UTF8Encoding]::new($true))
          & "$env:WINDIR\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'test-msp11.ps1'
          if ($LASTEXITCODE -ne 0) {throw "MSSpeech test failed $LASTEXITCODE"}
